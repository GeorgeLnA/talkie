<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; media-src 'self' blob:; connect-src 'none'; worker-src 'self';">
<title>Talkie</title>
<link rel="stylesheet" href="overlay.css">
</head>
<body>
<div id="wrap">
  <div id="top" class="hit hidden">
    <div id="pill" class="pill"></div>
    <div id="orb" class="orb"></div>
  </div>
  <div id="picker" class="picker hit hidden">
    <div class="p-head"><span class="p-title">Talk to</span><span id="p-dnd" class="p-dnd hidden">do not disturb is on</span></div>
    <ul id="p-list"></ul>
    <div id="p-empty" class="p-empty hidden">Nobody else has joined yet.<br>Send them the invite email. Once someone joins, they appear here.</div>
    <div id="p-foot" class="p-foot">
      <button id="p-chats">Chats<span id="p-new" class="p-new hidden"></span><kbd>C</kbd></button>
      <button id="p-dndbtn">Do not disturb<span id="p-dndstate"></span><kbd>D</kbd></button>
    </div>
    <div id="p-hint" class="p-hint"></div>
  </div>
  <div id="box" class="box hit hidden">
    <div class="box-head"><span class="dot"></span><span id="box-title"></span></div>
    <div id="box-sub" class="box-sub"></div>
    <div class="box-actions">
      <button id="b-play" class="go">Play</button>
      <button id="b-wait">Wait 5 min</button>
      <button id="b-later">Later</button>
      <button id="b-reply">Reply</button>
    </div>
  </div>
  <div id="toast" class="toast hit hidden"></div>
</div>
<script src="audio.js"></script>
<script src="overlay.js"></script>
</body>
</html>
